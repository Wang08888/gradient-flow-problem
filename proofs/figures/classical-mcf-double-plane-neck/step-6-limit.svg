<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f6f9f"/>
    </marker>
    <style>
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#18324b}
      .small{font-size:18px}.mid{font-size:22px}.big{font-size:28px;font-weight:600}
      .window{fill:#f6f9fb;stroke:#7f9ab0;stroke-width:2;stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1200" height="620" rx="18" fill="#fbfdff"/>
  <text x="55" y="48" class="t big">第 6 步：固定局部窗口，令 εᵢ→0、Rᵢ→∞</text>

  <text x="105" y="93" class="t mid">有限 i</text>
  <rect x="55" y="115" width="315" height="330" rx="12" class="window"/>
  <text x="70" y="143" class="t small">固定球 Bᴸ 内</text>
  <line x1="80" y1="240" x2="342" y2="240" stroke="#2f6f9f" stroke-width="8"/>
  <line x1="80" y1="326" x2="342" y2="326" stroke="#2f6f9f" stroke-width="8"/>
  <line x1="310" y1="240" x2="310" y2="326" stroke="#6e879c" stroke-width="2"/>
  <line x1="300" y1="240" x2="320" y2="240" stroke="#6e879c" stroke-width="2"/>
  <line x1="300" y1="326" x2="320" y2="326" stroke="#6e879c" stroke-width="2"/>
  <text x="322" y="290" class="t small">2εᵢ</text>
  <path d="M345 240 C395 240 395 326 345 326" fill="none" stroke="#e76f51" stroke-width="7"/>
  <text x="220" y="410" class="t small" fill="#d4553b">连接颈尚可看见</text>

  <line x1="395" y1="282" x2="455" y2="282" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arr)"/>
  <text x="390" y="255" class="t small">i 增大</text>

  <text x="515" y="93" class="t mid">i 很大</text>
  <rect x="465" y="115" width="315" height="330" rx="12" class="window"/>
  <text x="480" y="143" class="t small">同一个固定球 Bᴸ</text>
  <line x1="490" y1="272" x2="752" y2="272" stroke="#2f6f9f" stroke-width="8"/>
  <line x1="490" y1="294" x2="752" y2="294" stroke="#2f6f9f" stroke-width="8"/>
  <line x1="705" y1="272" x2="705" y2="294" stroke="#6e879c" stroke-width="2"/>
  <text x="715" y="290" class="t small">2εᵢ</text>
  <path d="M820 240 C875 240 875 326 820 326" fill="none" stroke="#e76f51" stroke-width="7"/>
  <line x1="780" y1="185" x2="845" y2="185" stroke="#d4553b" stroke-width="3" marker-end="url(#arr)"/>
  <text x="790" y="165" class="t small" fill="#d4553b">颈移出 Bᴸ</text>
  <text x="525" y="410" class="t small">窗口内只剩两张越来越近的图</text>

  <line x1="805" y1="282" x2="870" y2="282" stroke="#2f6f9f" stroke-width="4" marker-end="url(#arr)"/>
  <text x="809" y="255" class="t small">取极限</text>

  <text x="927" y="93" class="t mid">局部极限</text>
  <rect x="875" y="115" width="270" height="330" rx="12" class="window"/>
  <text x="890" y="143" class="t small">支撑集合：平面 P</text>
  <line x1="905" y1="283" x2="1118" y2="283" stroke="#7654a6" stroke-width="12"/>
  <line x1="905" y1="276" x2="1118" y2="276" stroke="#2f6f9f" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="905" y1="290" x2="1118" y2="290" stroke="#2f6f9f" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="925" y="238" class="t mid" fill="#7654a6">同一位置承载两层面积</text>
  <text x="942" y="335" class="t big" fill="#7654a6">V∞ = 2|P|</text>
  <text x="905" y="408" class="t small">集合上看是一张平面</text>
  <text x="905" y="433" class="t small">varifold 上却是重数 2</text>

  <rect x="145" y="492" width="910" height="83" rx="12" fill="#fff3ec" stroke="#e9bca8"/>
  <text x="179" y="525" class="t mid" fill="#b94b35">核心思想：嵌入性阻止每个 M₀ⁱ 自交，却不阻止两张不同的嵌入图在极限中重合。</text>
  <text x="260" y="557" class="t mid">连接它们的固定尺度颈同时逃向空间无穷远。</text>
</svg>
