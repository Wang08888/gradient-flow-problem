<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f6f9f"/>
    </marker>
    <style>
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#18324b}
      .small{font-size:21px}.mid{font-size:24px}.big{font-size:28px;font-weight:600}
      .axis{stroke:#557089;stroke-width:2}.guide{stroke:#b8c9d8;stroke-width:2;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1000" height="520" rx="18" fill="#fbfdff"/>
  <text x="55" y="48" class="t big">第 1 步：先规定切向角如何平滑转过半圈</text>

  <line x1="105" y1="335" x2="900" y2="335" class="axis" marker-end="url(#arrow)"/>
  <line x1="105" y1="335" x2="105" y2="82" class="axis" marker-end="url(#arrow)"/>
  <text x="914" y="343" class="t mid">s</text>
  <text x="62" y="90" class="t mid">η₀</text>
  <text x="84" y="363" class="t small">0</text>
  <text x="886" y="363" class="t small">1</text>

  <line x1="300" y1="92" x2="300" y2="349" class="guide"/>
  <line x1="700" y1="92" x2="700" y2="349" class="guide"/>
  <text x="278" y="378" class="t small">1/4</text>
  <text x="678" y="378" class="t small">3/4</text>
  <line x1="105" y1="112" x2="900" y2="112" class="guide"/>
  <text x="73" y="120" class="t small">1</text>

  <path d="M105 335 L300 335 C385 335 415 223 500 223 C585 223 615 112 700 112 L900 112"
        fill="none" stroke="#e76f51" stroke-width="7" stroke-linecap="round"/>
  <text x="152" y="309" class="t mid" fill="#e76f51">η₀=0</text>
  <text x="455" y="240" class="t mid" fill="#e76f51">平滑增加</text>
  <text x="763" y="91" class="t mid" fill="#e76f51">η₀=1</text>

  <rect x="78" y="403" width="844" height="82" rx="12" fill="#eaf2f8" stroke="#aec5d8"/>
  <text x="100" y="435" class="t mid">切向角 α(s)=-πη₀(s)：</text>
  <text x="356" y="438" class="t big">→</text>
  <text x="450" y="438" class="t big">↘</text>
  <text x="535" y="438" class="t big">↓</text>
  <text x="620" y="438" class="t big">↙</text>
  <text x="714" y="438" class="t big">←</text>
  <text x="342" y="470" class="t small">0</text>
  <text x="438" y="470" class="t small">-π/4</text>
  <text x="521" y="470" class="t small">-π/2</text>
  <text x="610" y="470" class="t small">-3π/4</text>
  <text x="711" y="470" class="t small">-π</text>
</svg>
