<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <defs>
    <marker id="axisarrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#60798f"/>
    </marker>
    <style>
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#18324b}
      .small{font-size:19px}.mid{font-size:23px}.big{font-size:28px;font-weight:600}
      .axis{stroke:#60798f;stroke-width:2}.guide{stroke:#b8c9d8;stroke-width:2;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1100" height="600" rx="18" fill="#fbfdff"/>
  <text x="55" y="48" class="t big">第 4 步：在母线半平面中拼出完整母线 Γᵢ</text>

  <line x1="100" y1="510" x2="1030" y2="510" class="axis" marker-end="url(#axisarrow)"/>
  <line x1="100" y1="510" x2="100" y2="80" class="axis" marker-end="url(#axisarrow)"/>
  <text x="1040" y="518" class="t mid">r</text>
  <text x="65" y="88" class="t mid">z</text>

  <line x1="400" y1="95" x2="400" y2="520" class="guide"/>
  <line x1="720" y1="95" x2="720" y2="520" class="guide"/>
  <text x="375" y="548" class="t mid">Rᵢ</text>
  <text x="686" y="548" class="t mid">2Rᵢ</text>

  <line x1="100" y1="255" x2="400" y2="255" stroke="#2f6f9f" stroke-width="9" stroke-linecap="round"/>
  <line x1="100" y1="345" x2="400" y2="345" stroke="#2f6f9f" stroke-width="9" stroke-linecap="round"/>
  <path d="M400 255 C505 255 605 152 720 150" fill="none" stroke="#e4a11b" stroke-width="9" stroke-linecap="round"/>
  <path d="M720 450 C605 448 505 345 400 345" fill="none" stroke="#e4a11b" stroke-width="9" stroke-linecap="round"/>
  <path d="M720 150 L785 150 C955 150 988 282 970 305 C950 355 880 450 785 450 L720 450"
        fill="none" stroke="#e76f51" stroke-width="10" stroke-linecap="round"/>

  <circle cx="100" cy="255" r="7" fill="#17395c"/>
  <circle cx="100" cy="345" r="7" fill="#17395c"/>
  <text x="115" y="238" class="t small" fill="#2f6f9f">z=+εᵢ</text>
  <text x="115" y="375" class="t small" fill="#2f6f9f">z=-εᵢ</text>
  <text x="595" y="124" class="t small" fill="#b77900">到 z=h</text>
  <text x="586" y="485" class="t small" fill="#b77900">从 z=-h 返回</text>
  <text x="820" y="112" class="t small" fill="#d4553b">固定 U 形颈</text>

  <rect x="115" y="90" width="255" height="90" rx="12" fill="#eaf2f8" stroke="#bdd0df"/>
  <line x1="135" y1="120" x2="185" y2="120" stroke="#2f6f9f" stroke-width="8"/>
  <text x="200" y="127" class="t small">近平面盘</text>
  <line x1="135" y1="151" x2="185" y2="151" stroke="#e4a11b" stroke-width="8"/>
  <text x="200" y="158" class="t small">缓慢过渡区</text>

  <rect x="240" y="520" width="650" height="55" rx="10" fill="#fff3ec"/>
  <text x="268" y="554" class="t mid">局部间距 2εᵢ 很小，但闭合发生在远处 r≈2Rᵢ</text>
</svg>
