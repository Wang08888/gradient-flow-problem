<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e76f51"/>
    </marker>
    <marker id="axisarr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#60798f"/>
    </marker>
    <style>
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#18324b}
      .small{font-size:20px}.mid{font-size:24px}.big{font-size:28px;font-weight:600}
      .axis{stroke:#60798f;stroke-width:2}.guide{stroke:#bdcbd7;stroke-width:2;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1000" height="560" rx="18" fill="#fbfdff"/>
  <text x="55" y="48" class="t big">第 2 步：积分切向方向，得到无自交的 U 形母线</text>

  <line x1="205" y1="475" x2="900" y2="475" class="axis" marker-end="url(#axisarr)"/>
  <line x1="205" y1="475" x2="205" y2="65" class="axis" marker-end="url(#axisarr)"/>
  <text x="915" y="484" class="t mid">u</text>
  <text x="170" y="76" class="t mid">V</text>
  <line x1="205" y1="115" x2="880" y2="115" class="guide"/>
  <line x1="205" y1="425" x2="880" y2="425" class="guide"/>
  <text x="154" y="122" class="t mid">1</text>
  <text x="145" y="432" class="t mid">-1</text>

  <path d="M205 115 L350 115 C620 115 720 245 720 270 C720 295 620 425 350 425 L205 425"
        fill="none" stroke="#e76f51" stroke-width="9" stroke-linecap="round"/>
  <circle cx="205" cy="115" r="8" fill="#17395c"/>
  <circle cx="205" cy="425" r="8" fill="#17395c"/>
  <text x="70" y="110" class="t mid">(0,1)</text>
  <text x="58" y="447" class="t mid">(0,-1)</text>

  <line x1="250" y1="115" x2="320" y2="115" stroke="#e76f51" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="691" y1="190" x2="713" y2="235" stroke="#e76f51" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="680" y1="365" x2="625" y2="403" stroke="#e76f51" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="335" y1="425" x2="260" y2="425" stroke="#e76f51" stroke-width="4" marker-end="url(#arr)"/>

  <line x1="845" y1="115" x2="845" y2="425" stroke="#2f6f9f" stroke-width="3"/>
  <line x1="830" y1="115" x2="860" y2="115" stroke="#2f6f9f" stroke-width="3"/>
  <line x1="830" y1="425" x2="860" y2="425" stroke="#2f6f9f" stroke-width="3"/>
  <text x="870" y="278" class="t mid" fill="#2f6f9f">落差 2</text>

  <rect x="282" y="485" width="550" height="52" rx="10" fill="#eaf2f8"/>
  <text x="305" y="518" class="t mid">V 不增，且转弯段严格下降；曲线没有自交</text>
  <text x="520" y="91" class="t small" fill="#e76f51">除端点外始终有 U(s)&gt;0</text>
</svg>
