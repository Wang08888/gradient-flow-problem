<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="bluePlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9dcff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#4c9be8" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="orangePlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0a6" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ee9f29" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="purplePlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dacaff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#8666d6" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="greenPlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f3df" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#35a66f" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#355f86"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#c93b3b"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #14283d; }
      .title { font-size: 48px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #4f6478; }
      .panelTitle { font-size: 27px; font-weight: 700; fill: #174a78; }
      .label { font-size: 22px; }
      .small { font-size: 18px; fill: #53687b; }
      .math { font-family: "Cambria Math", "Times New Roman", serif; font-size: 28px; fill: #15334e; }
      .mathSmall { font-family: "Cambria Math", "Times New Roman", serif; font-size: 22px; fill: #15334e; }
      .key { font-size: 29px; font-weight: 700; fill: #b52c2c; }
    </style>
  </defs>

  <rect width="1800" height="1150" fill="url(#bg)"/>
  <rect x="42" y="38" width="1716" height="1074" rx="28" fill="#ffffff" stroke="#c9d7e4" stroke-width="2" filter="url(#shadow)"/>

  <text x="900" y="112" text-anchor="middle" class="cn title">Limit flow 如何产生整数重数</text>
  <text x="900" y="154" text-anchor="middle" class="cn subtitle">图示 m=3：每一层都光滑收敛，但三层在极限中落到同一个几何支撑</text>

  <!-- panel 1 -->
  <rect x="88" y="205" width="470" height="470" rx="22" fill="#f9fcff" stroke="#9db9d2" stroke-width="2"/>
  <text x="323" y="252" text-anchor="middle" class="cn panelTitle">1. 奇点前：三张光滑图层</text>
  <text x="323" y="287" text-anchor="middle" class="mathSmall">t = tᵢ &lt; t₀,  εᵢ &gt; 0</text>

  <polygon points="145,380 392,320 505,389 258,449" fill="url(#bluePlane)" stroke="#2879bd" stroke-width="3"/>
  <polygon points="145,458 392,398 505,467 258,527" fill="url(#orangePlane)" stroke="#cf7b0c" stroke-width="3"/>
  <polygon points="145,536 392,476 505,545 258,605" fill="url(#purplePlane)" stroke="#7452bd" stroke-width="3"/>
  <text x="130" y="366" class="mathSmall">Γᵢ¹</text>
  <text x="130" y="444" class="mathSmall">Γᵢ²</text>
  <text x="130" y="522" class="mathSmall">Γᵢ³</text>
  <line x1="493" y1="395" x2="493" y2="462" stroke="#355f86" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="435" class="mathSmall">εᵢ</text>
  <text x="323" y="640" text-anchor="middle" class="cn small">每张 Γᵢᵏ 都是单独的光滑局部图</text>

  <!-- arrow 1 to 2 -->
  <line x1="580" y1="438" x2="672" y2="438" stroke="#355f86" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="626" y="408" text-anchor="middle" class="mathSmall">i → ∞</text>
  <text x="626" y="475" text-anchor="middle" class="cn small">εᵢ → 0</text>

  <!-- panel 2 -->
  <rect x="690" y="205" width="470" height="470" rx="22" fill="#f9fcff" stroke="#9db9d2" stroke-width="2"/>
  <text x="925" y="252" text-anchor="middle" class="cn panelTitle">2. 图层分别光滑收敛</text>
  <text x="925" y="287" text-anchor="middle" class="cn small">在每个紧集上，各层的所有导数均收敛</text>

  <polygon points="748,430 995,370 1108,439 861,499" fill="url(#bluePlane)" stroke="#2879bd" stroke-width="3"/>
  <polygon points="748,448 995,388 1108,457 861,517" fill="url(#orangePlane)" stroke="#cf7b0c" stroke-width="3"/>
  <polygon points="748,466 995,406 1108,475 861,535" fill="url(#purplePlane)" stroke="#7452bd" stroke-width="3"/>
  <line x1="803" y1="360" x2="1048" y2="530" stroke="#587b9b" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="925" y="576" text-anchor="middle" class="math">Γᵢᵏ → P  (k=1,2,3)</text>
  <text x="925" y="620" text-anchor="middle" class="cn small">光滑收敛描述每一张 sheet 的几何</text>

  <!-- arrow 2 to 3 -->
  <line x1="1182" y1="438" x2="1274" y2="438" stroke="#355f86" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1228" y="407" text-anchor="middle" class="cn small">取极限</text>

  <!-- panel 3 -->
  <rect x="1292" y="205" width="420" height="470" rx="22" fill="#f9fcff" stroke="#9db9d2" stroke-width="2"/>
  <text x="1502" y="252" text-anchor="middle" class="cn panelTitle">3. 极限几何支撑</text>
  <polygon points="1347,427 1559,374 1663,438 1451,491" fill="url(#greenPlane)" stroke="#208657" stroke-width="4"/>
  <text x="1502" y="352" text-anchor="middle" class="math">spt ||V∞|| = P</text>
  <text x="1502" y="542" text-anchor="middle" class="cn label">肉眼只看到一张平面 P</text>
  <rect x="1340" y="574" width="324" height="66" rx="14" fill="#fff1f1" stroke="#d84b4b" stroke-width="2"/>
  <text x="1502" y="616" text-anchor="middle" class="cn key">但权重仍记录 3 层</text>

  <!-- accounting strip -->
  <rect x="88" y="726" width="1624" height="202" rx="24" fill="#f4f9fd" stroke="#8eb1cf" stroke-width="2"/>
  <text x="135" y="776" class="cn panelTitle">Varifold 的面积权重不会因图层重合而消失</text>

  <rect x="134" y="811" width="440" height="76" rx="15" fill="#ffffff" stroke="#7fa6c5" stroke-width="2"/>
  <text x="354" y="858" text-anchor="middle" class="math">Vᵢ = |Γᵢ¹| + |Γᵢ²| + |Γᵢ³|</text>
  <line x1="600" y1="849" x2="744" y2="849" stroke="#355f86" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="672" y="825" text-anchor="middle" class="mathSmall">varifold 弱收敛</text>
  <rect x="770" y="811" width="325" height="76" rx="15" fill="#eaf8f0" stroke="#27905d" stroke-width="2"/>
  <text x="932" y="859" text-anchor="middle" class="math">Vᵢ ⇀ 3|P|</text>
  <line x1="1122" y1="849" x2="1236" y2="849" stroke="#c93b3b" stroke-width="5" marker-end="url(#redArrow)"/>
  <rect x="1262" y="811" width="390" height="76" rx="15" fill="#fff1f1" stroke="#d84b4b" stroke-width="2"/>
  <text x="1457" y="844" text-anchor="middle" class="math">Θ(V∞,0) = 3</text>
  <text x="1457" y="873" text-anchor="middle" class="cn small">不是 1</text>

  <!-- conclusion -->
  <rect x="88" y="965" width="1624" height="105" rx="18" fill="#fff7e8" stroke="#d99a2b" stroke-width="2"/>
  <text x="900" y="1008" text-anchor="middle" class="cn key">关键逻辑：支撑是平面  ≠  极限是重数一平面</text>
  <text x="900" y="1047" text-anchor="middle" class="cn label">一般 m 层情形：Γᵢᵏ 光滑收敛到 P（k=1,…,m），但 Vᵢ 弱收敛到 m|P|；必须另证 unit multiplicity。</text>

  <text x="90" y="1098" class="cn small">说明：这是极限机制示意图，不声称该多层情形必然发生；它说明“光滑图层收敛”本身不能排除整数重数。</text>
</svg>
